# Publication sur tag vX.Y.Z : image multi-arch et chart Helm (OCI) sur ghcr.io.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image amd64 pour le scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cluster-atlas:scan
          build-args: VERSION=${{ steps.v.outputs.version }}
      - name: Trivy (aucune vulnérabilité critique publiée)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cluster-atlas:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
      - uses: azure/setup-helm@v5
      - name: Chart OCI
        run: |
          helm package deploy/helm/cluster-atlas --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/cluster-atlas-${{ steps.v.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
