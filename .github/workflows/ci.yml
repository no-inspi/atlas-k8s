# Intégration continue : lint, tests (Go, front, chart), e2e en mode démo,
# image multi-arch et scan Trivy. Aucune publication ici (voir release.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet et tests
        run: make test-go
      - name: helm lint
        run: helm lint deploy/helm/cluster-atlas --set auth.oidc.clientID=ci --set publicURL=https://atlas.example.com

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Navigateur Playwright
        run: cd web && npm ci && npx playwright install --with-deps chromium
      - name: e2e en mode démo
        run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-resultats
          path: |
            web/test-results
            web/e2e/__screenshots__

  image:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-arch (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image amd64 pour le scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cluster-atlas:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
      - name: Trivy (échec sur vulnérabilité critique)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cluster-atlas:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
