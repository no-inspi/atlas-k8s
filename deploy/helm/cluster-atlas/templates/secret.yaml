{{- include "atlas.validate" . }}
{{- if not .Values.auth.oidc.existingSecret }}
{{- $name := include "atlas.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* La clé de chiffrement des cookies est générée une fois puis conservée
       aux upgrades : la changer déconnecterait tous les utilisateurs. */}}
{{- $cookieKey := "" }}
{{- if and $existing $existing.data }}
{{- $cookieKey = index $existing.data "cookie-key" | default "" }}
{{- end }}
{{- if not $cookieKey }}
{{- $cookieKey = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-key: {{ $cookieKey }}
  client-secret: {{ .Values.auth.oidc.clientSecret | b64enc | quote }}
{{- end }}
