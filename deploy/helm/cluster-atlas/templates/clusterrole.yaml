{{- if .Values.rbac.create }}
# Droits du ServiceAccount (spec, « ClusterRole du ServiceAccount ») : lecture
# pour le cache partagé, impersonation pour tout le reste. Aucune écriture sur
# les workloads, aucun pods/exec, ni secrets ni configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
    {{- with .Values.rbac.impersonate.users }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  - apiGroups: [""]
    resources: [groups]
    verbs: [impersonate]
    {{- with .Values.rbac.impersonate.groups }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, events]
    verbs: [get, list, watch]
  # Jalon 8 : Services, entrées et PVC (lecture seule ; un type refusé est désactivé).
  # get : onglet YAML en auth.mode=none, où le client du ServiceAccount sert.
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [list, watch]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, traefikservices]
    verbs: [get, list, watch]
  # Jalon 9 : Gateway API, PV sans PVC, CRD (lecture seule ; un type refusé est désactivé).
  # GatewayClass : lue par l'onglet YAML seulement (ni informer ni sonde), donc get seul.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    # list/watch sur les CRD : prise en compte à chaud ; sans ce droit,
    # découverte au démarrage seulement.
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "atlas.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "atlas.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
