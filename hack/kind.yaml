# Cluster kind de développement : 4 workers répartis en 3 pools, étiquetés
# comme des nodes GKE pour que la ville ait ses trois quartiers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: atlas
nodes:
  - role: control-plane
    labels:
      cloud.google.com/gke-nodepool: system
      # ingress-nginx (manifeste kind) se place ici et écoute sur le port 80 de l'hôte.
      ingress-ready: "true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
  - role: worker
    labels:
      cloud.google.com/gke-nodepool: default-pool
      node.kubernetes.io/instance-type: e2-standard-4
      topology.kubernetes.io/zone: europe-west1-b
  - role: worker
    labels:
      cloud.google.com/gke-nodepool: default-pool
      node.kubernetes.io/instance-type: e2-standard-4
      topology.kubernetes.io/zone: europe-west1-c
  - role: worker
    labels:
      cloud.google.com/gke-nodepool: spot-pool
      cloud.google.com/gke-spot: "true"
      node.kubernetes.io/instance-type: e2-standard-8
      topology.kubernetes.io/zone: europe-west1-d
  - role: worker
    labels:
      cloud.google.com/gke-nodepool: gpu-pool
      node.kubernetes.io/instance-type: g2-standard-8
      topology.kubernetes.io/zone: europe-west1-b
      atlas.io/fake-gpu: "true"
